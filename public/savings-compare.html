      },

        tags: ['双被保人', '保单贷款', '分红可期'], currency: 'cny',
        scores: { returnPotential: 60, flexibility: 65, currency: 20, inheritance: 60, guarantee: 70, convenience: 95, access: 90 },
        metrics: {
          productType: '分红型增额终身寿险', returnStructure: '保证现金价值+保单分红',
          expectedReturn: '保证现金价值年增速约1.75%，加分红演示', guaranteedReturn: '较高。保证现金价值按约1.75%逐年增长，写入合同'
          currency: '人民币', currencyConvert: '不支持', premiumTerm: '3/6/8年', minEntry: '门槛较低',
          withdraw: '支持减保，保单贷款最高可贷现金价值80%', inheritance: '支持双被保险人，可指定受益人',
          additional: '双被保险人延长财富积累期、平安服务网络', risk: '收益上限较低、分红不确定、无货币转换'
        },
        scenarios: { year10: '约55万', year20: '约75万', year30: '约100万', year60: '约200万' }
      },
      cpic: {
        name: '福有余（2025）终身寿险（分红型）', shortName: '福有余2025', company: '中国太保', type: '内地分红型增额终身寿险',
        tags: ['回本快', '养老社区', '减保灵活'], currency: 'cny',
        scores: { returnPotential: 75, flexibility: 75, currency: 20, inheritance: 50, guarantee: 70, convenience: 90, access: 90 },
        metrics: {
          productType: '分红型增额终身寿险', returnStructure: '保证现金价值+浮动红利（交清增额）',
          expectedReturn: '5年缴约第6年回本（含红利），长期含红利演示较高', guaranteedReturn: '较高。保证现金价值写入合同，5年缴约第8年保证部分接近回本，长期保证IRR约1.5%-2.0%'
          currency: '人民币', currencyConvert: '不支持', premiumTerm: '趸交/3/5/9/10年', minEntry: '5000元起',
          withdraw: '支持减保，每年累计不超过基本保额20%', inheritance: '指定受益人',
          additional: '可对接太保家园高端养老社区、减保灵活', risk: '分红非保证、无货币转换、养老社区有保费门槛'
        },
        scenarios: { year10: '约55-60万', year20: '约80-95万', year30: '约105-125万（含红利）', year60: '约270万（含红利）' }
      }
    };

    const dimensions = [
      { key: 'returnPotential', name: '长期综合收益潜力', weight: 1.6, desc: '演示总回报、长期复利增长能力' },
      { key: 'flexibility', name: '提取与现金流灵活性', weight: 1.0, desc: '减保、部分提取、自主入息' },
      { key: 'currency', name: '货币多元与转换', weight: 0.9, desc: '多币种、汇率风险对冲' },
      { key: 'inheritance', name: '财富传承功能', weight: 0.9, desc: '更换受保人、保单分拆、信托式传承' },
      { key: 'guarantee', name: '保证收益稳健性', weight: 0.4, desc: '保证现金价值、保底利率（仅作参考）' },
      { key: 'convenience', name: '购买与服务便利性', weight: 0.6, desc: '内地购买、理赔、服务网点' },
      { key: 'access', name: '投保门槛与可达性', weight: 0.5, desc: '最低保费、投保年龄、健康告知' }
    ];

    let selectedGoal = 'wealth';
    function selectGoal(el) { document.querySelectorAll('[data-goal]').forEach(c => c.classList.remove('selected')); el.classList.add('selected'); selectedGoal = el.dataset.goal; }

    const premiumRange = document.getElementById('premiumRange');
    const premiumValue = document.getElementById('premiumValue');
    premiumRange.addEventListener('input', () => { premiumValue.textContent = premiumRange.value + '万'; });

    function getInput() {
      return {
        age: parseInt(document.getElementById('age').value) || 35,
        gender: document.getElementById('gender').value,
        premium: parseInt(premiumRange.value) || 10,
        term: parseInt(document.getElementById('paymentTerm').value) || 5,
        currency: document.getElementById('currency').value,
        horizon: document.getElementById('horizon').value,
        goal: selectedGoal,
        needs: Array.from(document.querySelectorAll('input[name="needs"]:checked')).map(cb => cb.value)
      };
    }

    function calculateScore(product, input) {
      let score = 0, weights = 0;
      const s = product.scores;
      dimensions.forEach(d => {
        let w = d.weight;
        if (d.key === 'returnPotential') { if (input.horizon === 'long') w *= 1.5; if (input.horizon === 'short') w *= 0.6; }
        if (d.key === 'currency') { if (input.currency === 'multi' || input.currency === 'usd') w *= 1.5; if (input.needs.includes('currency')) w *= 1.4; }
        if (d.key === 'inheritance') { if (input.goal === 'inheritance' || input.needs.includes('inherit')) w *= 1.5; }
        if (d.key === 'flexibility') { if (input.goal === 'retirement' || input.needs.includes('withdraw')) w *= 1.4; }
        if ((d.key === 'convenience' || d.key === 'access') && input.currency === 'cny' && !input.needs.includes('currency')) w *= 1.2;
        score += s[d.key] * w; weights += w;
      });
      const goalBoosts = { wealth: ['returnPotential', 'flexibility'], education: ['currency', 'flexibility', 'returnPotential'], retirement: ['flexibility', 'returnPotential', 'guarantee'], inheritance: ['inheritance', 'returnPotential', 'currency'] };
      let goalBonus = 0;
      (goalBoosts[input.goal] || []).forEach(k => { goalBonus += s[k] * 0.25; });
      return Math.round(score / weights + goalBonus);
    }

    function getScoreLevel(score) {
      if (score >= 90) return { label: '高度匹配', color: 'bg-green-500/20 text-green-400' };
      if (score >= 75) return { label: '较为匹配', color: 'bg-fin-gold/20 text-fin-gold' };
      if (score >= 60) return { label: '一般匹配', color: 'bg-yellow-500/20 text-yellow-400' };
      return { label: '匹配度低', color: 'bg-red-500/20 text-red-400' };
    }

    function goalText(g) { return { wealth: '财富增值', education: '子女教育', retirement: '养老储备', inheritance: '资产传承' }[g] || '财富增值'; }
    function horizonText(h) { return { short: '中短期持有', medium: '中长期持有', long: '超长期/传承' }[h] || '中长期持有'; }
    function currencyText(c) { return { cny: '人民币保单', usd: '美元保单', multi: '多元货币' }[c] || '人民币保单'; }

    function generateComparison() {
      const input = getInput();
      const panel = document.getElementById('resultPanel');
      const productList = Object.keys(products).map(k => ({ key: k, ...products[k], score: calculateScore(products[k], input) }));
      productList.sort((a, b) => b.score - a.score);
      const winner = productList[0], runnerUp = productList[1];

      panel.innerHTML = `
        <div class="card rounded-2xl p-6 mobile-compact relative">
          <span class="recommend-badge">最佳匹配</span>
          <div class="flex flex-col md:flex-row md:items-start gap-5">
            <div class="flex-1">
              <div class="text-xs text-fin-text3 mb-1">智能推荐</div>
              <h2 class="text-2xl font-bold mb-2">${winner.name}</h2>
              <div class="flex flex-wrap gap-2 mb-3">${winner.tags.map(t => `<span class="badge bg-fin-gold/20 text-fin-gold">${t}</span>`).join('')}</div>
              <p class="text-sm text-fin-text2 mb-4">基于您「${goalText(input.goal)}、${horizonText(input.horizon)}、${currencyText(input.currency)}」的需求，<strong class="text-fin-text">${winner.company} ${winner.shortName}</strong> 在综合匹配度上领先。${winner.key === 'prudential' ? '其长期复利增长、多元货币转换与信托式传承工具最契合您的规划目标。' : '作为内地头部保险公司产品，在便利性、保证收益稳健性方面更具优势。'}</p>
              ${winner.key === 'prudential' ? `<div class="bg-fin-surface2 rounded-xl p-4 mb-4"><div class="text-xs text-fin-text3 mb-2">推荐缴费与币种方案</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm"><div><span class="text-fin-text3">年缴保费</span><div class="text-fin-gold font-bold">${input.premium}万美元等值</div></div><div><span class="text-fin-text3">缴费期</span><div class="text-fin-text font-bold">${input.term}年</div></div><div><span class="text-fin-text3">建议币种</span><div class="text-fin-text font-bold">${input.currency === 'cny' ? '港币/人民币' : '美元'}</div></div><div><span class="text-fin-text3">核心用途</span><div class="text-fin-text font-bold">${goalText(input.goal)}</div></div></div></div>` : ''}
              <div class="flex flex-wrap gap-3">
                <a href="https://wa.me/85262331166" target="_blank" class="btn-primary px-5 py-2.5 rounded-xl text-sm inline-flex items-center gap-2"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.48A11.96 11.96 0 0012 0C5.37 0 0 5.37 0 12c0 2.11.55 4.1 1.52 5.83L0 24l6.35-1.66A11.95 11.95 0 0012 24c6.63 0 12-5.37 12-12 0-3.21-1.25-6.21-3.48-8.52zM12 21.8c-1.97 0-3.83-.52-5.43-1.43l-.39-.22-3.77.99 1.01-3.67-.26-.41A9.79 9.79 0 012.2 12 9.8 9.8 0 0112 2.2 9.8 9.8 0 0121.8 12c0 5.41-4.39 9.8-9.8 9.8zm5.37-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.08-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.48-.5-.67-.51l-.57-.01c-.2 0-.52.08-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.47 1.07 2.89 1.22 3.09.15.2 2.1 3.21 5.09 4.5.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35z"/></svg>咨询顾问获取方案</a>
                <button onclick="toggleCollapse('whyWinner', this)" class="px-5 py-2.5 rounded-xl text-sm border border-fin-gold text-fin-gold hover:bg-fin-gold/10 inline-flex items-center gap-2">展开详情 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
              </div>
            </div>
            <div class="flex flex-col items-center justify-center min-w-[120px]">
              <div class="score-ring" style="background: conic-gradient(#c9a96e ${winner.score*3.6}deg, #1a1a26 0deg);"><div class="w-[52px] h-[52px] rounded-full bg-fin-surface flex items-center justify-center">${winner.score}</div></div>
              <div class="text-[10px] text-fin-text3 mt-1">综合匹配度</div>
              <span class="badge ${getScoreLevel(winner.score).color} mt-2">${getScoreLevel(winner.score).label}</span>
            </div>
          </div>
          <div id="whyWinner" class="collapsible-content mt-4"><div class="bg-fin-surface2 rounded-xl p-4 text-sm text-fin-text2">${generateWhyBetter(winner, runnerUp)}</div></div>
        </div>

        <div class="card rounded-2xl p-6 mobile-compact overflow-x-auto">
          <h3 class="text-lg font-bold mb-4">核心优势维度评分（单项满分100）</h3>
          <table class="w-full compare min-w-[600px]">
            <thead><tr><th class="text-fin-text3">维度</th><th class="text-fin-gold">${winner.shortName}</th><th>${runnerUp.shortName}</th><th>其他产品</th><th class="text-fin-text3">说明</th></tr></thead>
            <tbody>
              ${dimensions.map(d => {
                const wv = winner.scores[d.key], rv = runnerUp.scores[d.key];
                const others = productList.filter(p => p.key !== winner.key && p.key !== runnerUp.key);
                const isTop = wv >= Math.max(rv, ...others.map(o => o.scores[d.key]));
                return `<tr><td class="font-medium">${d.name}</td><td class="${isTop ? 'highlight-cell' : ''}"><div class="flex items-center gap-2"><span class="font-bold ${isTop ? 'text-fin-gold' : ''}">${wv}</span><div class="advantage-bar flex-1 max-w-[80px]"><div class="advantage-fill" style="width:${wv}%"></div></div></div></td><td><div class="flex items-center gap-2"><span class="font-bold">${rv}</span><div class="advantage-bar flex-1 max-w-[80px]"><div class="advantage-fill" style="width:${rv}%"></div></div></div></td><td class="text-fin-text2">${others.map(o => `${o.shortName}: ${o.scores[d.key]}`).join('<br>')}</td><td class="text-xs text-fin-text3">${d.desc}</td></tr>`;
              }).join('')}
              <tr class="bg-fin-surface2/50"><td class="font-bold">综合匹配度</td><td class="font-bold text-fin-gold text-lg">${winner.score}</td><td class="font-bold">${runnerUp.score}</td><td class="text-fin-text2">${productList.filter(p => p.key !== winner.key && p.key !== runnerUp.key).map(o => `${o.shortName}: ${o.score}`).join('<br>')}</td><td class="text-xs text-fin-text3">原始总分，反映真实分差，不设100分上限</td></tr>
            </tbody>
          </table>
        </div>

        <div class="card rounded-2xl p-6 mobile-compact">
          <h3 class="text-lg font-bold mb-4">预期收益走势对比（5年缴，年缴10万人民币等值）</h3>
          <p class="text-xs text-fin-text3 mb-4">以下演示值含非保证分红，仅供参考，实际收益以保险公司公布为准。内地产品为人民币计价，香港保诚产品以美元/港币保单按汇率折算。</p>
          <div class="overflow-x-auto">
            <table class="w-full compare min-w-[600px]">
              <thead><tr><th>产品</th><th>第10年</th><th>第20年</th><th>第30年</th><th>第60年</th><th class="text-fin-text3">长期IRR（演示）</th></tr></thead>
              <tbody>
                ${productList.map(p => `<tr class="${p.key === winner.key ? 'bg-fin-gold/5' : ''}"><td class="font-medium">${p.company}<br><span class="text-fin-gold">${p.shortName}</span></td><td>${p.scenarios.year10}</td><td>${p.scenarios.year20}</td><td>${p.scenarios.year30}</td><td>${p.scenarios.year60}</td><td class="text-xs text-fin-text3">${p.key === 'prudential' ? '6.0%+' : p.key === 'cpic' ? '3.0%-4.0%' : '2.5%左右'}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card rounded-2xl p-6 mobile-compact">
          <h3 class="text-lg font-bold mb-4">收益结构说明：为何保诚综合收益更高</h3>
          <div class="space-y-4 text-sm text-fin-text2">
            <p><strong class="text-fin-gold">保诚信守明天的核心价值在于长期综合回报。</strong>以美元5年缴保单为例：第25年总回报 IRR 达<span class="text-fin-gold font-bold">6.09%</span>，第30年达<span class="text-fin-gold font-bold">6.20%</span>；同样的保费投入，长期账户价值可达内地产品的数倍。这正是香港储蓄险通过全球资产配置、权益类投资占比更高所带来的复利优势。</p>
            <p><strong class="text-fin-gold">「低保证、高分红」是主动设计，不是缺陷。</strong>保诚将更多资金配置于股票、债券等增长型资产，因此保证部分较低（第20年保证IRR约0.13%），但非保证分红空间更大；内地增额寿则将更多资金配置于固定收益资产，保证IRR约1.5%-2.5%，但长期总回报上限通常在2.5%-4%区间。两者是不同风险偏好与收益目标的选择。</p>
            <p><strong class="text-fin-gold">适合谁？</strong>如果你投资期限在20年以上、希望分享全球资本市场长期增长、有美元/港币等外币需求，或希望实现跨代传承，保诚的低保证+高预期结构反而更匹配目标；如果你极度厌恶波动、需要短期内确定回本，内地高保证产品更适合。</p>
            <p class="text-xs text-fin-text3 pt-2 border-t border-fin-border">提示：分红收益为非保证，实际派发可能高于或低于演示。历史表现不代表未来，但保诚作为全球大型寿险集团，其分红实现率与资产管理能力是重要参考。</p>
          </div>
        </div>

        <div class="card rounded-2xl p-6 mobile-compact overflow-x-auto">
          <h3 class="text-lg font-bold mb-4">产品功能横向对比</h3>
          <table class="w-full compare min-w-[700px]">
            <thead><tr><th class="text-fin-text3">对比项</th><th class="text-fin-gold">信守明天</th><th>鑫益传家</th><th>盛世金越尊享版</th><th>福有余2025</th></tr></thead>
            <tbody>${generateFeatureRows()}</tbody>
          </table>
        </div>

        <div class="card rounded-2xl p-6 mobile-compact">
          <h3 class="text-lg font-bold mb-4">场景化方案匹配</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${generateScenarioCards(productList)}</div>
        </div>

        <div class="card rounded-2xl p-6 mobile-compact">
          <h3 class="text-lg font-bold mb-3">重要提示</h3>
          <ul class="text-sm text-fin-text2 space-y-2 list-disc pl-5">
            <li>香港保险产品（如保诚信守明天）的分红收益为非保证收益，实际派发可能高于或低于演示值。</li>
            <li>内地客户投保香港保险需本人赴港签署文件，保单以港币/美元计价，存在汇率波动风险。</li>
            <li>内地储蓄险的保证收益写入合同，但演示红利同样不保证，某些年度红利可能为零。</li>
            <li>本页面数据基于公开资料整理，仅供横向对比参考，具体以各保险公司最新条款与利益说明为准。</li>
            <li>投保前请咨询持牌专业人士，根据自身财务状况与风险承受能力做出决策。</li>
          </ul>
        </div>
      `;
    }

    function generateWhyBetter(winner, runnerUp) {
      if (winner.key === 'prudential') {
        return `<p class="mb-2"><strong class="text-fin-gold">长期收益潜力显著：</strong>信守明天第25年总回报率达6.09%（5年缴美元保单），长期复利效应下财富增值空间远超内地固定/分红型增额寿。</p><p class="mb-2"><strong class="text-fin-gold">真正的多元货币工具：</strong>6种主要货币无限次转换，适合有海外教育、养老、移民或资产配置需求的客户，有效对冲单一货币风险。</p><p class="mb-2"><strong class="text-fin-gold">信托式传承功能：</strong>市场首创的自主传承与自主入息选项，可在受保人离世后按人生大事或年龄分期支付身故赔偿，实现类似信托的财富管理。</p><p class="mb-2"><strong class="text-fin-gold">灵活锁定收益：</strong>终期红利锁定/解锁选项，可在市场高位锁定收益、低位解锁再增值，提供主动风险管理能力。</p><p>相较之下，${runnerUp.company}${runnerUp.shortName}在${runnerUp.key === 'cpic' ? '养老社区与内地便利性' : '购买便利性与保证收益'}方面更具优势，更适合无需跨境配置、追求稳健保证收益的客户。</p>`;
      }
      return `<p class="mb-2">${winner.company}${winner.shortName}在${winner.key === 'cpic' ? '养老社区对接、回本速度与减保灵活性' : '品牌服务网络、购买便利性与保证收益稳健性'}方面表现更优。</p><p class="mb-2">内地储蓄险的优势在于人民币计价、无汇率波动、购买与服务便捷、保证部分写入合同。</p><p>若您有海外资金需求或希望获取更高长期收益潜力，香港保诚信守明天仍是更优选择。</p>`;
    }

    function generateFeatureRows() {
      const rows = [
        { label: '产品类型', key: 'productType' }, { label: '收益结构', key: 'returnStructure' },
        { label: '演示长期收益', key: 'expectedReturn' }, { label: '保证收益', key: 'guaranteedReturn' },
        { label: '支持币种', key: 'currency' }, { label: '货币转换', key: 'currencyConvert' },
        { label: '缴费期', key: 'premiumTerm' }, { label: '资金提取', key: 'withdraw' },
        { label: '传承功能', key: 'inheritance' }, { label: '附加权益', key: 'additional' },
        { label: '主要风险', key: 'risk' }
      ];
      const keys = ['prudential', 'chinalife', 'pingan', 'cpic'];
      return rows.map(r => `<tr><td class="font-medium text-fin-text3">${r.label}</td>${keys.map((k, idx) => `<td class="${idx === 0 ? 'text-fin-gold' : 'text-fin-text2'}">${products[k].metrics[r.key]}</td>`).join('')}</tr>`).join('');
    }

    function generateScenarioCards(productList) {
      const scenarios = [
        { key: 'education', title: '子女教育金规划', icon: '🎓', desc: '留学费用需外币支付，货币转换与长期增值并重。' },
        { key: 'retirement', title: '养老现金流规划', icon: '🏖️', desc: '稳定现金流、保证收益与养老社区权益的综合考量。' },
        { key: 'inheritance', title: '跨代财富传承', icon: '🏛️', desc: '保单延续、分期给付与家族财富分配能力。' },
        { key: 'emergency', title: '应急资金安排', icon: '🛡️', desc: '保单贷款、减保灵活性与回本速度。' }
      ];
      const weights = {
        education: { prudential: 100, cpic: 80, chinalife: 60, pingan: 55 },
        retirement: { prudential: 95, cpic: 90, chinalife: 70, pingan: 65 },
        inheritance: { prudential: 100, cpic: 50, chinalife: 45, pingan: 55 },
        emergency: { prudential: 85, cpic: 80, pingan: 85, chinalife: 70 }
      };
      return scenarios.map(s => {
        const sorted = [...productList].sort((a, b) => weights[s.key][b.key] - weights[s.key][a.key]);
        const top = sorted[0];
        return `<div class="bg-fin-surface2 rounded-xl p-4"><div class="flex items-center gap-2 mb-2"><span class="text-xl">${s.icon}</span><h4 class="font-bold">${s.title}</h4></div><p class="text-sm text-fin-text2 mb-2">${s.desc}</p><p class="text-sm text-fin-text2 mb-3">${top.scenarios[s.key]}</p><div class="text-xs text-fin-gold font-medium">最适配：${top.company} ${top.shortName}</div></div>`;
      }).join('');
    }

    function toggleCollapse(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const isExpanded = el.classList.contains('expanded');
      if (isExpanded) {
        el.classList.remove('expanded');
        btn.innerHTML = '展开详情 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';
      } else {
        el.classList.add('expanded');
        btn.innerHTML = '收起详情 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>';
      }
    }

    window.addEventListener('load', generateComparison);
  </script>
</body>
</html>
