# =============================================================================
# Nginx 反向代理配置 for minelab.top
# 说明：
#   - 所有请求转发到本地 Node.js 应用（端口 3000）
#   - 静态资源可由 Nginx 直接提供，减轻 Node 压力
#   - 保险工具通过 /insurance/ 子路径访问，无需额外配置
# 安装：
#   sudo cp deploy/nginx-minelab.conf /etc/nginx/sites-available/minelab
#   sudo sed -i 's|__DOMAIN__|minelab.top|g' /etc/nginx/sites-available/minelab
#   sudo sed -i 's|__PROJECT_DIR__|/opt/mine-platform|g' /etc/nginx/sites-available/minelab
#   sudo ln -sf /etc/nginx/sites-available/minelab /etc/nginx/sites-enabled/minelab
#   sudo nginx -t && sudo systemctl restart nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求全部 301 到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # SSL 证书路径（由 certbot 自动配置）
    # ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 日志
    access_log /var/log/nginx/minelab-access.log;
    error_log /var/log/nginx/minelab-error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源直接由 Nginx 提供（可选，提升性能）
    # location /assets/ {
    #     alias __PROJECT_DIR__/public/assets/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }

    # 保险测评页静态资源（可选加速）
    # location /insurance-static/ {
    #     alias __PROJECT_DIR__/public/insurance-static/;
    #     expires 7d;
    # }

    # 所有请求转发到 Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
